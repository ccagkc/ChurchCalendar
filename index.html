<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葵涌堂靈命塑造月曆</title>

    <script>
        tailwind.config = {

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

</head>
<body class="text-gray-800 font-sans antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SITE_CONFIG = {
            SPREADSHEET_ID: '1_FfNhrUwgI3l0vOpDqWfooAVQUja-Sl-YQOna3nJyQo', 
            SHEET_NAME: 'ReadBible',
            EVENT_SHEET_NAME: 'Event', 
            titleLine1: "剛強壯膽 · 踐信力行",
            titleLine2: "葵涌堂 靈命塑造月曆", 
            subtitle: "神的話語是我們腳前的燈、路上的光",
            description: "同讀聖言行真道 · 聆聽聖靈活新生",
            footerText: "© CCAGKC · SPIRITUAL FORMATION CALENDAR",
            storageKey: "kc-church-bible-progress-v3",
            pseudoEmailDomain: "@kcc.bible.app",
            adminEmailDomain: "@admin.kcc.app"
        };
        
        const formatDate = (dateObj) => {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        const getTodayStr = () => formatDate(new Date());

        const parseExternalLink = (url, type = 'audio') => {
            if (!url || typeof url !== 'string' || url.trim() === '') return null;
            if (!url.includes('google.com')) return { type: 'raw', url };
            const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (!idMatch) return { type: 'raw', url };
            const id = idMatch[1];
            return { type: 'embed', url: type === 'audio' ? `https://drive.google.com/file/d/${id}/preview` : `https://docs.google.com/document/d/${id}/preview` };
        };

        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || "";
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        const App = () => {
            const [view, setView] = useState('calendar'); 
            const [selectedDate, setSelectedDate] = useState(null);
            const [currentViewMonth, setCurrentViewMonth] = useState(new Date()); 
            const [showAnswer, setShowAnswer] = useState(false);
            
            const [data, setData] = useState({}); 
            const [eventData, setEventData] = useState({}); 
            const [validDates, setValidDates] = useState([]); 
            const [completed, setCompleted] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const [appSettings, setAppSettings] = useState({ groups: ['未入組/其他', '少年崇拜', '奇行組', 'IMA組', '加利利奮青', '彼得組', '隨意行組', '葡萄果組', 
                                                                      'Spectrum組', '家靈一組', '7-11組', '清心組', 'ReConnect組', '基順ECO組', '蜜組', '喜樂組'] });
            const [userProfile, setUserProfile] = useState(null);
            
            const [fb, setFb] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [syncing, setSyncing] = useState(false);

            let unsubscribeProgress = useRef(null);
            let unsubscribeSettings = useRef(null);
            let unsubscribeProfile = useRef(null);

            useEffect(() => {
                let unsubscribeAuth = null;
                const initFirebase = async () => {
                    try {
                        const appModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const authModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const dbModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                
                        const firebaseConfig = {
                            apiKey: "AIzaSyAEMB-eVojfzcUMyKt9JgGK_okPRO2V73g",
                            authDomain: "ccagkc-biblereading-project.firebaseapp.com",
                            databaseURL: "https://ccagkc-biblereading-project-default-rtdb.asia-southeast1.firebasedatabase.app",
                            projectId: "ccagkc-biblereading-project",
                            storageBucket: "ccagkc-biblereading-project.firebasestorage.app",
                            messagingSenderId: "962459311265",
                            appId: "1:962459311265:web:cbad43a46491a046e5e4e0"
                        };
                        
                        const app = appModule.initializeApp(firebaseConfig);
                        const auth = authModule.getAuth(app);
                        const db = dbModule.getFirestore(app);
                        const appId = 'kcc-bible-app'; 
                
                        setFb({ auth, db, appId, authModule, dbModule });
                
                        const settingsRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general');
                        unsubscribeSettings.current = dbModule.onSnapshot(settingsRef, (snap) => {
                            if (snap.exists()) setAppSettings(snap.data());
                        }, (err) => console.warn("等待設定檔授權中:", err.message));
                
                        unsubscribeAuth = authModule.onAuthStateChanged(auth, (user) => {
                            if (unsubscribeProfile.current) unsubscribeProfile.current();
                            if (unsubscribeProgress.current) unsubscribeProgress.current();
                
                            if (user) {
                                setCurrentUser(user);
                                if (user.email.endsWith(SITE_CONFIG.adminEmailDomain) && view !== 'admin-dashboard') setView('admin-dashboard');
                                
                                const profileRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', user.uid);
                                unsubscribeProfile.current = dbModule.onSnapshot(profileRef, (snap) => {
                                    if (snap.exists()) {
                                        setUserProfile(snap.data());
                                    } else if (user.email.endsWith(SITE_CONFIG.adminEmailDomain)) {
                                        setUserProfile({ username: user.email.split('@')[0], role: 'admin' });
                                    }
                                });
                
                                const progressRef = dbModule.doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'progress');
                                unsubscribeProgress.current = dbModule.onSnapshot(progressRef, (docSnap) => {
                                    if (docSnap.exists()) setCompleted(docSnap.data().completedDates || []);
                                });
                            } else {
                                setCurrentUser(null);
                                setUserProfile(null);
                                setCompleted([]); 
                                setView('calendar'); 
                            }
                        });
                    } catch (e) {
                        console.error("Firebase 模組載入失敗", e);
                    }
                };
                initFirebase();

                return () => { 
                    if (unsubscribeAuth) unsubscribeAuth();
                    if (unsubscribeProgress.current) unsubscribeProgress.current(); 
                    if (unsubscribeSettings.current) unsubscribeSettings.current();
                    if (unsubscribeProfile.current) unsubscribeProfile.current();
                };
            }, []);

            useEffect(() => {
                const fetchSheetData = async () => {
                    try {
                        const bibleUrl = `https://docs.google.com/spreadsheets/d/${SITE_CONFIG.SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SITE_CONFIG.SHEET_NAME)}`;
                        const eventUrl = `https://docs.google.com/spreadsheets/d/${SITE_CONFIG.SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SITE_CONFIG.EVENT_SHEET_NAME)}`;

                        const [bibleResp, eventResp] = await Promise.all([
                            fetch(bibleUrl),
                            fetch(eventUrl).catch(() => null) 
                        ]);

                        if (!bibleResp.ok) throw new Error("無法連接到讀經資料庫。請確認已發佈到網路。");
                        
                        const bibleText = await bibleResp.text();
                        const bibleRows = parseCSV(bibleText);
                        if (bibleRows.length < 2) throw new Error("讀經資料庫格式異常。");

                        const headers = bibleRows[0].map(h => h.trim());
                        const items = {};
                        const datesArray = [];
                        
                        for(let i=1; i<bibleRows.length; i++) {
                            const row = bibleRows[i];
                            if (!row || row.length < 2) continue;
                            const item = {};
                            headers.forEach((h, idx) => item[h] = row[idx]);
                            if(item['日期']) {
                                const dateStr = item['日期'].replace(/\//g, '-').split(' ')[0];
                                const parts = dateStr.split('-');
                                if (parts.length === 3) {
                                    const stdDate = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
                                    items[stdDate] = item;
                                    if (!datesArray.includes(stdDate)) datesArray.push(stdDate);
                                }
                            }
                        }
                        datesArray.sort();
                        setData(items);
                        setValidDates(datesArray);

                        const events = {};
                        if (eventResp && eventResp.ok) {
                            const eventText = await eventResp.text();
                            const eventRows = parseCSV(eventText);
                            if (eventRows.length >= 2) {
                                const eHeaders = eventRows[0].map(h => h.trim());
                                for(let i=1; i<eventRows.length; i++) {
                                    const row = eventRows[i];
                                    if (!row || row.length < 2) continue;
                                    const item = {};
                                    eHeaders.forEach((h, idx) => item[h] = row[idx]);
                                    if(item['日期']) {
                                        const dateStr = item['日期'].replace(/\//g, '-').split(' ')[0];
                                        const parts = dateStr.split('-');
                                        if (parts.length === 3) {
                                            const stdDate = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
                                            events[stdDate] = item;
                                        }
                                    }
                                }
                            }
                        }
                        setEventData(events);

                        if (datesArray.length > 0) {
                            const todayStr = getTodayStr();
                            let initialTarget = todayStr;
                            if (!items[todayStr]) {
                                const pastDates = datesArray.filter(d => d <= todayStr);
                                initialTarget = pastDates.length > 0 ? pastDates[pastDates.length - 1] : datesArray[0];
                            }
                            const parts = initialTarget.split('-');
                            setCurrentViewMonth(new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1));
                        }
                    } catch (e) {
                        setError(e.message);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchSheetData();
            }, []);
            
            const toggleFinish = async (dateStr) => {
                const isDone = completed.includes(dateStr);
                const next = isDone ? completed.filter(x => x !== dateStr) : [...completed, dateStr];
                
                setCompleted(next); 
                
                if (currentUser && fb) {
                    setSyncing(true);
                    try {
                        const progressRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'users', currentUser.uid, 'data', 'progress');
                        await fb.dbModule.setDoc(progressRef, { completedDates: next }, { merge: true });
                        
                        const profileRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', currentUser.uid);
                        await fb.dbModule.setDoc(profileRef, { 
                            completedCount: next.length,
                            lastActive: new Date().toISOString()
                        }, { merge: true });

                    } catch (e) {
                        console.error("寫入雲端失敗 (請確認權限設定)", e);
                    } finally {
                        setSyncing(false);
                    }
                } else if (fb && !currentUser) {
                    setShowAuthModal(true);
                }
            };

            const AuthModal = () => {
                const [step, setStep] = useState(1);
                const [username, setUsername] = useState('');
                const [selectedGroup, setSelectedGroup] = useState('');
                const [authError, setAuthError] = useState('');
                const [processing, setProcessing] = useState(false);

                if (!showAuthModal) return null;

                const handleAction = async (e) => {
                    e.preventDefault();
                    if (username.trim().length < 2) return setAuthError('代號請至少輸入兩個字');
                    setProcessing(true);
                    setAuthError('');
                    
                    const FIXED_PASS = "KccBible@2026_AutoPass";
                    const fakeEmail = `${username.trim().toLowerCase()}${SITE_CONFIG.pseudoEmailDomain}`;

                    try {
                        if (step === 1) {
                            try {
                                await fb.authModule.signInWithEmailAndPassword(fb.auth, fakeEmail, FIXED_PASS);
                                setShowAuthModal(false); 
                            } catch (err) {
                                setStep(2);
                            }
                        } else if (step === 2) {
                            if (!selectedGroup) {
                                setAuthError('請選擇你所屬的小組');
                                setProcessing(false);
                                return;
                            }
                            const cred = await fb.authModule.createUserWithEmailAndPassword(fb.auth, fakeEmail, FIXED_PASS);
                            const profileRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', cred.user.uid);
                            await fb.dbModule.setDoc(profileRef, {
                                username: username.trim(),
                                group: selectedGroup,
                                role: 'user',
                                completedCount: 0,
                                createdAt: new Date().toISOString()
                            });
                            setShowAuthModal(false);
                        }
                    } catch (error) {
                        setAuthError("系統連線異常，請稍後再試。");
                    } finally {
                        setProcessing(false);
                    }
                };

                return (
                    <div className="fixed inset-0 bg-nature-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-[2rem] w-full max-w-md shadow-2xl overflow-hidden animate-fade-in">
                            <div className="bg-nature-600 p-6 text-white relative">
                                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full hover:bg-nature-700 transition">
                                    <i className="fa-solid fa-xmark"></i>
                                </button>
                                <h2 className="text-2xl font-bold font-serif flex items-center">
                                    <i className="fa-solid fa-cloud-arrow-up mr-3"></i> {step === 1 ? '開啟進度同步' : '首次登記資料'}
                                </h2>
                            </div>
                            
                            <div className="p-6 md:p-8">
                                {authError && <div className="bg-red-50 text-red-600 p-3 rounded-xl text-sm mb-4 border border-red-100"><i className="fa-solid fa-triangle-exclamation mr-1"></i> {authError}</div>}

                                <form onSubmit={handleAction} className="space-y-4">
                                    {step === 1 ? (
                                        <div className="animate-fade-in">
                                            <label className="block text-sm font-bold text-nature-800 mb-2">輸入你的個人代號 或 英文簡稱</label>
                                            <input type="text" value={username} onChange={e=>setUsername(e.target.value.replace(/[^a-zA-Z0-9_-]/g, ''))} placeholder="例如：peter-chan" className="w-full px-4 py-3.5 rounded-xl border border-gray-200 focus:outline-none focus:border-nature-500 bg-gray-50 text-lg" required />
                                            <p className="text-xs text-gray-500 mt-2"><i className="fa-solid fa-circle-info"></i> 系統自動辨識，首次登記將填寫所屬教會小組。</p>
                                        </div>
                                    ) : (
                                        <div className="animate-fade-in space-y-4">
                                            <div className="bg-nature-50 p-3 rounded-xl border border-nature-100 flex items-center">
                                                <i className="fa-solid fa-user-tag text-nature-400 mr-3 text-lg"></i>
                                                <div>
                                                    <div className="text-xs text-gray-500">正在註冊個人代號</div>
                                                    <div className="font-bold text-nature-800">{username}</div>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-nature-800 mb-2">請選擇你所屬的小組 <span className="text-red-500">*</span></label>
                                                <select value={selectedGroup} onChange={e=>setSelectedGroup(e.target.value)} className="w-full px-4 py-3.5 rounded-xl border border-gray-200 focus:outline-none focus:border-nature-500 bg-gray-50 text-lg" required>
                                                    <option value="" disabled>-- 請選擇小組 --</option>
                                                    {appSettings.groups.map(g => <option key={g} value={g}>{g}</option>)}
                                                </select>
                                                <p className="text-xs text-gray-500 mt-2">此資料將協助教會統計讀經參與情況。</p>
                                            </div>
                                        </div>
                                    )}

                                    <button type="submit" disabled={processing} className="w-full bg-nature-600 hover:bg-nature-700 text-white font-bold py-4 rounded-xl transition-all shadow-md active:scale-95 disabled:opacity-50 mt-4 text-lg">
                                        {processing ? <i className="fa-solid fa-spinner fa-spin"></i> : (step === 1 ? '確認代號' : '完成註冊')}
                                    </button>
                                    
                                    {step === 2 && (
                                        <button type="button" onClick={() => setStep(1)} className="w-full py-2 text-gray-500 text-sm hover:text-gray-700 mt-2">返回修改代號</button>
                                    )}
                                </form>
                            </div>
                        </div>
                    </div>
                );
            };

            const AdminLoginModal = () => {
                const [password, setPassword] = useState('');
                const [isRegister, setIsRegister] = useState(false);
                const [errorMsg, setErrorMsg] = useState('');
                const [loading, setLoading] = useState(false);

                if (!showAdminLogin) return null;

                const handleAdminAuth = async (e) => {
                    e.preventDefault();
                    setLoading(true);
                    setErrorMsg('');
                    const adminEmail = `admin${SITE_CONFIG.adminEmailDomain}`;
                    
                    try {
                        if (isRegister) {
                            const cred = await fb.authModule.createUserWithEmailAndPassword(fb.auth, adminEmail, password);
                            const profileRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', cred.user.uid);
                            await fb.dbModule.setDoc(profileRef, { username: '系統管理員', role: 'admin', createdAt: new Date().toISOString() });
                        } else {
                            const cred = await fb.authModule.signInWithEmailAndPassword(fb.auth, adminEmail, password);
                            const profileRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', cred.user.uid);
                            const snap = await fb.dbModule.getDoc(profileRef);
                            if (!snap.exists()) {
                                await fb.dbModule.setDoc(profileRef, { username: '系統管理員', role: 'admin', createdAt: new Date().toISOString() });
                            }
                        }
                        setShowAdminLogin(false);
                        setView('admin-dashboard'); 
                    } catch (err) {
                        if (err.code === 'auth/email-already-in-use') {
                            setErrorMsg("管理員已存在，請取消勾選「首次使用」直接登入");
                        } else if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found') {
                            setErrorMsg(isRegister ? "設定失敗 (密碼需至少6個字元)" : "登入失敗 (若是剛重置系統，請勾選下方選項重新建立帳號)");
                        } else {
                            setErrorMsg(err.message);
                        }
                    } finally {
                        setLoading(false);
                    }
                };

                return (
                    <div className="fixed inset-0 bg-gray-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-[1.5rem] w-full max-w-sm shadow-2xl overflow-hidden animate-fade-in">
                            <div className="bg-gray-800 p-5 text-white flex justify-between items-center">
                                <h3 className="font-bold flex items-center"><i className="fa-solid fa-shield-halved mr-2 text-nature-300"></i> 管理員安全登入</h3>
                                <button onClick={() => setShowAdminLogin(false)} className="text-gray-400 hover:text-white transition"><i className="fa-solid fa-xmark text-lg"></i></button>
                            </div>
                            <form onSubmit={handleAdminAuth} className="p-6 md:p-8 space-y-5">
                                {errorMsg && <div className="text-red-500 text-sm bg-red-50 p-3 rounded-xl border border-red-100"><i className="fa-solid fa-triangle-exclamation mr-1"></i> {errorMsg}</div>}
                                
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-2">請輸入管理員密碼</label>
                                    <input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-nature-500 focus:ring-4 focus:ring-nature-100 transition text-xl tracking-widest text-center font-bold" required autoFocus />
                                </div>
                                
                                <div className="flex items-center justify-center mt-2">
                                    <input type="checkbox" id="regAdmin" checked={isRegister} onChange={(e) => setIsRegister(e.target.checked)} className="mr-2 w-4 h-4 text-nature-600 rounded border-gray-300" />
                                    <label htmlFor="regAdmin" className="text-xs text-gray-500 cursor-pointer hover:text-gray-700 transition">首次使用 (建立管理員密碼)</label>
                                </div>
                                
                                <button type="submit" disabled={loading} className="w-full bg-gray-800 text-white font-bold py-4 rounded-xl hover:bg-gray-700 transition-all active:scale-95 shadow-md text-lg">
                                    {loading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isRegister ? '設定新密碼' : '安全登入')}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            };
            
            const AdminDashboard = () => {
                const [activeTab, setActiveTab] = useState('stats'); 
                const [newGroup, setNewGroup] = useState('');
                const [usersList, setUsersList] = useState([]);
                const [loadingStats, setLoadingStats] = useState(false);

                useEffect(() => {
                    if (activeTab === 'stats' && fb && userProfile?.role === 'admin') {
                        setLoadingStats(true);
                        const fetchUsers = async () => {
                            try {
                                const usersCol = fb.dbModule.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles');
                                const snapshot = await fb.dbModule.getDocs(usersCol);
                                const list = [];

                const handleExportCSV = () => {

                    const csvContent = [

                        ...rows.map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))

                    const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                    const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                    
                    const link = document.createElement('a');
                    const url = URL.createObjectURL(blob);
                    const today = new Date();

                    link.setAttribute('href', url);

                                                ) : (
                                                    <div className="p-6 md:p-8 text-lg md:text-xl leading-loose font-serif text-gray-800 whitespace-pre-wrap">
                                                        {currentData['經文']}
                                                    </div>
                                                )}
                                            </div>
                                        </section>
                                    )}

                                    {hasExplanation && (
                                        <section>
                                            <h4 className="text-nature-700 font-bold mb-4 border-l-4 border-nature-500 pl-3">經文釋義</h4>
                                            <div className="bg-nature-50/30 p-6 md:p-8 rounded-3xl border border-nature-50 text-gray-600 leading-loose text-base md:text-lg italic font-serif">
                                                {currentData['釋義']}
                                            </div>
                                        </section>
                                    )}

                                    {hasQuestion && (
                                        <section className="pt-6 border-t border-dashed border-nature-200">
                                            <div className="flex justify-between items-end mb-6">
                                                <h4 className="text-nature-700 font-bold border-l-4 border-nature-500 pl-3">將神的話讀入心</h4>
                                            </div>
                                            <div className="rounded-2xl overflow-hidden bg-white border-2 border-nature-100 min-h-[100px]">
                                                {questionInfo && questionInfo.type === 'embed' ? (
                                                    <div className="relative pt-[130%] md:pt-[100%] w-full">
                                                        <iframe src={questionInfo.url} className="absolute inset-0 w-full h-full border-0"></iframe>
                                                    </div>
                                                ) : (
                                                    <div className="p-6 md:p-8 text-lg md:text-xl leading-loose font-serif text-gray-800 whitespace-pre-wrap">
                                                        {currentData['問題']}
                                                    </div>
                                                )}
                                            </div>

                                            {hasAnswer && (
                                                <div className="mt-6">
                                                    {!showAnswer ? (
                                                        <button 
                                                            onClick={() => setShowAnswer(true)}
                                                            className="px-6 py-3 bg-nature-100 hover:bg-nature-200 text-nature-700 font-bold rounded-xl transition-all shadow-sm flex items-center w-full md:w-auto justify-center"
                                                        >
                                                            <i className="fa-solid fa-lightbulb mr-2"></i> 顯示參考答案
                                                        </button>
                                                    ) : (
                                                        <div className="bg-nature-50 border border-nature-200 rounded-2xl p-6 md:p-8 relative mt-4 animate-fade-in">
                                                            <h4 className="text-nature-700 font-bold mb-4 flex items-center border-b border-nature-200 pb-3">
                                                                <i className="fa-solid fa-key mr-2"></i> 參考答案
                                                            </h4>
                                                            {answerInfo && answerInfo.type === 'embed' ? (
                                                                <div className="relative pt-[130%] md:pt-[100%] w-full mt-4">
                                                                    <iframe src={answerInfo.url} className="absolute inset-0 w-full h-full border-0 rounded-xl"></iframe>
                                                                </div>
                                                            ) : (
                                                                <div className="text-lg md:text-xl leading-loose font-serif text-gray-700 whitespace-pre-wrap">
                                                                    {currentData['答案']}
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            )}
                                        </section>
                                    )}
                                </div>
                            </article>
                        )}

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                            {hasBibleContent ? (
                                <button 
                                    onClick={()=>toggleFinish(selectedDate)}
                                    className={`md:col-span-2 py-5 rounded-2xl text-lg font-bold shadow-xl transition-all active:scale-95 flex items-center justify-center ${
                                        isCompleted ? 'bg-white text-nature-600 border-2 border-nature-600' : 'bg-nature-600 text-white hover:bg-nature-700'
                                    }`}
                                >
                                    {syncing ? <i className="fa-solid fa-spinner fa-spin mr-3 text-xl"></i> : <i className={`fa-solid mr-3 text-xl ${isCompleted ? 'fa-check-double' : 'fa-check'}`}></i>}
                                    {isCompleted ? '我已完成今日進度' : '標記今日完成'}
                                </button>
                            ) : (
                                <div className="md:col-span-2 hidden md:block"></div>
                            )}
                            
                            <div className="flex gap-2">
                                <button 
                                     disabled={currentIndex <= 0} 
                                     onClick={() => { setSelectedDate(allContentDates[currentIndex - 1]); setShowAnswer(false); window.scrollTo(0,0); }} 
                                     className="flex-1 py-5 rounded-2xl bg-white border border-nature-200 text-nature-700 disabled:opacity-20 shadow-lg flex items-center justify-center font-bold transition hover:bg-nature-50"
                                >
                                    <i className="fa-solid fa-arrow-left md:mr-2"></i> <span className="hidden md:inline">前一項</span>
                                </button>
                                <button 
                                    disabled={currentIndex === -1 || currentIndex >= allContentDates.length - 1} 
                                    onClick={() => { setSelectedDate(allContentDates[currentIndex + 1]); setShowAnswer(false); window.scrollTo(0,0); }} 
                                    className="flex-1 py-5 rounded-2xl bg-white border border-nature-200 text-nature-700 disabled:opacity-20 shadow-lg flex items-center justify-center font-bold transition hover:bg-nature-50"
                                >
                                    <span className="hidden md:inline">下一項</span> <i className="fa-solid fa-arrow-right md:ml-2"></i>
                                </button>
                            </div>
                        </div>

                        <div className="flex justify-center mb-16">
                            <button 
                                onClick={()=>{ setView('calendar'); setShowAnswer(false); window.scrollTo(0,0); }} 
                                className="w-full md:w-auto px-10 py-4 bg-white border-2 border-nature-200 text-nature-700 rounded-2xl shadow-sm hover:bg-nature-50 hover:border-nature-400 font-bold flex items-center justify-center transition-all group active:scale-95"
                            >
                                <i className="fa-solid fa-house mr-3 text-nature-500 group-hover:text-nature-600 transition-colors"></i> 
                                <span className="text-lg">返回月曆主頁</span>
                            </button>
                        </div>
                    </div>
                );
            };

            if (error) return (
                <div className="flex-grow flex flex-col items-center justify-center text-red-600 bg-red-50 p-6 text-center animate-fade-in shadow-inner rounded-3xl m-4 border-2 border-red-200">
                    <i className="fa-solid fa-triangle-exclamation text-6xl mb-6 drop-shadow-md"></i>
                    <p className="font-bold text-2xl mb-3 text-red-800">無法載入系統</p>
                    <p className="text-red-600 font-medium max-w-md">{error}</p>
                </div>
            );

            return (
                <>
                    <AuthModal />
                    <AdminLoginModal />
                    <header className="bg-white/70 backdrop-blur-md border-b border-white/50 shadow-sm sticky top-0 z-40">
                        <div className="max-w-5xl mx-auto px-4 py-4 md:py-5 flex justify-between items-center gap-2">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-nature-600 rounded-lg flex items-center justify-center text-white shadow-md transform -rotate-3 cursor-pointer" onClick={()=>setView('calendar')}><i className="fa-solid fa-cross text-xl"></i></div>
                                <div><h1 className="text-xl md:text-2xl font-bold text-nature-900 tracking-tight">{SITE_CONFIG.titleLine2}</h1></div>
                            </div>
                            
                            {fb && (
                                <div className="flex items-center gap-2">
                                    {currentUser ? (
                                        <div className="group relative">
                                            <button className={`flex items-center gap-2 border px-3 py-1.5 rounded-full text-xs md:text-sm font-bold shadow-sm ${userProfile?.role === 'admin' ? 'bg-gray-800 text-white border-gray-900' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>
                                                <i className={`fa-solid ${userProfile?.role === 'admin' ? 'fa-shield-halved' : 'fa-cloud-check'}`}></i> 
                                                <span>{currentUser.email.split('@')[0]}</span>
                                            </button>
                                            <div className="absolute right-0 mt-2 w-36 bg-white rounded-xl shadow-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
                                                {userProfile?.role === 'admin' && view !== 'admin-dashboard' && (
                                                    <button onClick={()=>setView('admin-dashboard')} className="w-full text-left px-4 py-3 text-sm text-nature-700 hover:bg-nature-50 font-bold border-b"><i className="fa-solid fa-server mr-2"></i> 進入後台</button>
                                                )}
                                                <button onClick={()=>{ 
                                                    setCompleted([]); 
                                                    setCurrentUser(null);
                                                    setUserProfile(null);
                                                    setView('calendar'); 
                                                    fb.authModule.signOut(fb.auth); 
                                                }} className="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-red-50 rounded-b-xl font-bold"><i className="fa-solid fa-arrow-right-from-bracket mr-2"></i> 登出帳號</button>
                                            </div>
                                        </div>
                                    ) : (
                                        <button onClick={() => setShowAuthModal(true)} className="flex items-center gap-2 bg-white border border-nature-200 hover:border-nature-400 text-nature-600 px-3 py-1.5 rounded-full text-xs md:text-sm font-bold shadow-sm transition-all active:scale-95">
                                            <i className="fa-solid fa-cloud-arrow-up"></i> <span className="hidden md:inline">登入 / 註冊</span>
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    </header>

                    {view === 'calendar' && (
                        <div className="bg-gradient-to-br from-nature-800 to-nature-600 text-white py-10 px-4 shadow-xl text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                                <i className="fa-solid fa-seedling text-[15rem] -ml-10 -mt-10"></i>
                            </div>
                            <h1 className="text-3xl md:text-5xl font-bold mb-2 relative z-10 tracking-tight">{SITE_CONFIG.titleLine1}</h1>
                            <h1 className="text-3xl md:text-5xl font-bold mb-2 relative z-10 tracking-tight">{SITE_CONFIG.titleLine2}</h1>
                            <p className="text-xl md:text-2xl font-serif italic text-nature-200 mb-4 relative z-10 mt-4">{SITE_CONFIG.subtitle}</p>
                            <p className="text-nature-100 opacity-90 relative z-10 font-medium">{SITE_CONFIG.description}</p>
                        </div>
                    )}

                    {/* 💡 專家優化：將背景調暗，凸顯卡片感 */}
                    <main className="flex-grow py-8 px-4 w-full bg-slate-50">
                        {view === 'admin-dashboard' && userProfile?.role === 'admin' ? (
                            <AdminDashboard />
                        ) : view === 'reader' && selectedDate ? (
                            renderReaderView()
                        ) : (
                            renderCalendarView()
                        )}
                    </main>

                    <footer className="py-10 bg-white border-t border-nature-100 text-center text-gray-400 text-[10px] tracking-widest uppercase mt-auto">
                        <p className="mb-2"><i className="fa-solid fa-seedling mr-2"></i>{SITE_CONFIG.description}</p>
                        <div className="flex justify-center items-center gap-4 opacity-50 hover:opacity-100 transition">
                            <p>{SITE_CONFIG.footerText}</p>
                            {!currentUser && <button onClick={() => setShowAdminLogin(true)} className="text-nature-400 hover:text-nature-600" title="管理員登入"><i className="fa-solid fa-lock"></i></button>}
                        </div>
                    </footer>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
