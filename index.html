            VAPID_KEY: "BL_D6wHmhWI-MDvEK0Ow3NkB8y51FjANqNNlDNsY1ZFDbgcB_Y_M8Fnffr4Zj9niuJjlIpXZ3Y8EM8JdI82e3QM"

        // ==========================================

        const CONTENT_TYPES = {
            bible: {
                sheetName: 'ReadBible',
                id: 'bible',
                label: '讀經',
                colorClass: 'nature',          // 對應你現有的 nature- 色系

        // ==========================================
        // 資料工具函式
        // ==========================================
        const normalizeDate = (str) => {
            if (!str) return null;
            const parts = String(str).replace(/\//g, '-').split(' ')[0].split('-');
            if (parts.length !== 3) return null;
            return `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
        };
        
        const fetchSheetAsObjects = async (sheetName) => {
            const url = `https://docs.google.com/spreadsheets/d/${SITE_CONFIG.SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
            const resp = await fetch(url).catch(() => null);
            if (!resp || !resp.ok) return [];
            const text = await resp.text();
            const rows = parseCSV(text);
            if (rows.length < 2) return [];
            const headers = rows[0].map(h => h.trim());
            return rows.slice(1)
                .filter(row => row && row.length >= 2)
                .map(row => {
                    const obj = {};
                    headers.forEach((h, i) => { obj[h] = row[i] ?? ''; });
                    return obj;
                })
                .filter(obj => obj['日期']);
        };
        
        const loadAllContent = async () => {
            const dataByDate = {};
            const dateSet = new Set();
        
            for (const [typeKey, config] of Object.entries(CONTENT_TYPES)) {
                const rows = await fetchSheetAsObjects(config.sheetName);
                for (const row of rows) {
                    const dateStr = normalizeDate(row['日期']);
                    if (!dateStr) continue;
        
                    dateSet.add(dateStr);
                    if (!dataByDate[dateStr]) dataByDate[dateStr] = {};
        
                    if (config.isMultiple) {
                        if (!dataByDate[dateStr][typeKey]) dataByDate[dateStr][typeKey] = [];
                        dataByDate[dateStr][typeKey].push(row);
                    } else {
                        dataByDate[dateStr][typeKey] = row;
                    }
                }
            }
        
            const allDates = Array.from(dateSet).sort();
            return { dataByDate, allDates };
        };

        const getLocalKey = (uid = null) => uid ? `${SITE_CONFIG.storageKey}-${uid}` : `${SITE_CONFIG.storageKey}-guest`;
        
        const formatDate = (dateObj) => {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        const getTodayStr = () => formatDate(new Date());

        const parseExternalLink = (url, type = 'audio') => {
            if (!url || typeof url !== 'string' || url.trim() === '') return null;
            if (!url.includes('google.com')) return { type: 'raw', url };
            const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (!idMatch) return { type: 'raw', url };
            const id = idMatch[1];
            return { type: 'embed', url: type === 'audio' ? `https://drive.google.com/file/d/${id}/preview` : `https://docs.google.com/document/d/${id}/preview` };
        };

        const getImageUrl = (str) => {
            if (!str) return null;
            let url = String(str).trim();
            if (!url.startsWith('http')) return null;
            let fileId = null;
            if (url.includes('drive.google.com/file/d/')) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match) fileId = match[1];
            } else if (url.includes('drive.google.com/open') || url.includes('drive.google.com/uc')) {
                const match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match) fileId = match[1];
            }
            if (fileId) return `https://drive.google.com/thumbnail?id=${fileId}&sz=w1000`;
            return url;
        };

        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || "";
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        const App = () => {
            const [view, setView] = useState('calendar'); 
            const [selectedDate, setSelectedDate] = useState(null);
            const [currentViewMonth, setCurrentViewMonth] = useState(new Date()); 
            const [showAnswer, setShowAnswer] = useState(false);
            
            const [devotionModalOpen, setDevotionModalOpen] = useState(false);

            const [dataByDate, setDataByDate] = useState({});   
            const [allDates, setAllDates] = useState([]);       
            
            // 🟢 新增：歷史通知訊息中心 State
            const [notificationsList, setNotificationsList] = useState([]);

            const [completed, setCompleted] = useState(() => {
                const guestSaved = localStorage.getItem(getLocalKey(null));
                return guestSaved ? JSON.parse(guestSaved) : [];
            });
            
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const [appSettings, setAppSettings] = useState({ groups: ['未入組/其他', '少年崇拜', '奇行組', 'IMA組', '加利利奮青', '彼得組', '隨意行組', '葡萄果組', 'Spectrum組', '家靈一組', '7-11組', '清心組', 'ReConnect組', '基順ECO組', '蜜組', '喜樂組'] });
            const [userProfile, setUserProfile] = useState(null);
            
            const [fb, setFb] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [syncing, setSyncing] = useState(false);

            const [pushSubscribed, setPushSubscribed] = useState(false);

            const [isOffline, setIsOffline] = useState(!navigator.onLine);
            const [fontScale, setFontScale] = useState(() => parseInt(localStorage.getItem('kcc_font_scale')) || 0);
            
            let unsubscribeProgress = useRef(null);
            let unsubscribeSettings = useRef(null);
            let unsubscribeProfile = useRef(null);
            let unsubscribeNotif = useRef(null); // 🟢 新增：歷史通知 Unsubscribe Ref

            const data = {};
            const eventData = {};
            const devotionData = {};
            const validDates = allDates;
            
            Object.entries(dataByDate).forEach(([dateStr, contents]) => {
                if (contents.bible) data[dateStr] = contents.bible;
                if (contents.event) eventData[dateStr] = contents.event;
                if (contents.devotion) devotionData[dateStr] = contents.devotion;
            });

            const goToCalendar = () => {
                setView('calendar'); setShowAnswer(false); setDevotionModalOpen(false);
                window.scrollTo(0,0); window.history.replaceState(null, '', window.location.pathname);
            };

            const goToDate = (dateStr) => {
                setSelectedDate(dateStr); setShowAnswer(false); window.scrollTo(0,0);
                window.history.replaceState(null, '', `?date=${dateStr}`);
                
                const dayHasBible = validDates.includes(dateStr);
                const dayHasEvent = (eventData[dateStr] || []).length > 0;
                const dayHasDevotion = !!devotionData[dateStr];

                if (!dayHasBible && !dayHasEvent && dayHasDevotion) {
                    setView('reader'); setDevotionModalOpen(true);
                } else {
                    setView('reader'); setDevotionModalOpen(false);
                }
            };

            const toggleFontScale = () => {
                const nextScale = (fontScale + 1) % 3;
                setFontScale(nextScale); localStorage.setItem('kcc_font_scale', nextScale);
            };

            const handleClearGuestProgress = () => {
                if (confirm('確定要清除這台設備上的未登入閱讀紀錄嗎？\n(這不會影響任何已註冊帳號的資料)')) {
                    setCompleted([]); localStorage.removeItem(getLocalKey(null));
                }
            };

            const autoSilentTokenRefresh = async (user, fbObj) => {
                if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
                if (!fbObj || !fbObj.messagingModule || !fbObj.messaging || !user) return;
            
                if (localStorage.getItem(`kcc_push_disabled_${user.uid}`) === 'true') {
                    console.log('ℹ️ [FCM Engine] 用戶已手動停用推播，跳過背景自動刷新。');
                    return;
                }
            
                try {
                    const profileRef = fbObj.dbModule.doc(fbObj.db, 'artifacts', fbObj.appId, 'public', 'data', 'userProfiles', user.uid);
                    const profileSnap = await fbObj.dbModule.getDoc(profileRef);
            
                    if (profileSnap.exists() && profileSnap.data().notificationsEnabled === false) {
                        console.log('ℹ️ [FCM Engine] 雲端紀錄顯示推播已關閉，停止靜默綁定。');
                        return;
                    }
            
                    const registration = await navigator.serviceWorker.ready;
                    const freshToken = await fbObj.messagingModule.getToken(fbObj.messaging, { 
                        vapidKey: SITE_CONFIG.VAPID_KEY,
                        serviceWorkerRegistration: registration 
                    });
            
                    if (freshToken) {
                        await fbObj.dbModule.setDoc(profileRef, { 
                            fcmToken: freshToken, 
                            notificationsEnabled: true,
                            lastTokenRefresh: new Date().toISOString()
                        }, { merge: true });
            
                        setPushSubscribed(true);
                        console.log('✅ [FCM Engine] 背景靜默更新成功！');
                    }
                } catch (e) {
                    console.warn('⚠️ [FCM Engine] 靜默更新跳過:', e);
                }
            };
            
            const togglePushSubscription = async () => {
                if (!fb || !fb.messagingModule || !fb.messaging || !currentUser) {
                    alert('請先登入帳號以管理推播通知設定。'); return;
                }
            
                setSyncing(true);
                const profileRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', currentUser.uid);
            
                try {
                    if (pushSubscribed) {
                        if (confirm('確定要關閉推播通知嗎？關閉後您將無法收到教會的每日靈修與緊急動態。')) {
                            await fb.dbModule.setDoc(profileRef, { 
                                fcmToken: fb.dbModule.deleteField(), 
                                notificationsEnabled: false,
                                lastTokenUpdated: new Date().toISOString()
                            }, { merge: true });
            
                            localStorage.setItem(`kcc_push_disabled_${currentUser.uid}`, 'true');
            
                            try {
                                await fb.messagingModule.deleteToken(fb.messaging);
                            } catch (deleteErr) {
                                console.warn('⚠️ [FCM Engine] 設備端 Token 廢除靜默跳過:', deleteErr);
                            }
            
                            setPushSubscribed(false);
                            alert('🔕 已成功關閉推播通知。您可以隨時重新開啟！');
                        }
                    } else {
                        const permission = await Notification.requestPermission();
                        if (permission === 'granted') {
                            const registration = await navigator.serviceWorker.ready;
                            
                            const token = await fb.messagingModule.getToken(fb.messaging, { 
                                vapidKey: SITE_CONFIG.VAPID_KEY,
                                serviceWorkerRegistration: registration 
                            });
            
                            if (token) {
                                await fb.dbModule.setDoc(profileRef, { 
                                    fcmToken: token, 
                                    notificationsEnabled: true,
                                    lastTokenUpdated: new Date().toISOString()
                                }, { merge: true });
            
                                localStorage.removeItem(`kcc_push_disabled_${currentUser.uid}`);
            
                                setPushSubscribed(true);
                                alert('🔔 推播通知已成功啟用！');
                            }
                        } else {
                            alert('您已拒絕推播通知。如需開啟，請點擊網址列旁的「鎖頭 🔒」圖示更改權限。');
                        }
                    }
                } catch (e) {
                    console.error('Push Toggle Error:', e);
                    alert(`操作失敗：\n${e.message}`);
                } finally {
                    setSyncing(false);
                }
            };
            
            useEffect(() => {
                const handleOnline = () => setIsOffline(false);
                const handleOffline = () => setIsOffline(true);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => { window.removeEventListener('online', handleOnline); window.removeEventListener('offline', handleOffline); };
            }, []);

            useEffect(() => {
                let unsubscribeAuth = null;
                const initFirebase = async () => {
                    try {
                        const appModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const authModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const dbModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                        const messagingModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-messaging.js").catch(() => null);
                
                        const firebaseConfig = {
                            apiKey: "AIzaSyAEMB-eVojfzcUMyKt9JgGK_okPRO2V73g",
                            authDomain: "ccagkc-biblereading-project.firebaseapp.com",
                            databaseURL: "https://ccagkc-biblereading-project-default-rtdb.asia-southeast1.firebasedatabase.app",
                            projectId: "ccagkc-biblereading-project",
                            storageBucket: "ccagkc-biblereading-project.firebasestorage.app",
                            messagingSenderId: "962459311265",
                            appId: "1:962459311265:web:cbad43a46491a046e5e4e0"
                        };
                        
                        const app = appModule.initializeApp(firebaseConfig);
                        const auth = authModule.getAuth(app);
                        const db = dbModule.getFirestore(app);
                        const appId = 'ccagkc-ChurchCalendarApp'; 
                        
                        let messaging = null;
                        if (messagingModule && messagingModule.isSupported) {
                            const isSupported = await messagingModule.isSupported();
                            if (isSupported) messaging = messagingModule.getMessaging(app);
                        }
                
                        const fbObj = { auth, db, appId, authModule, dbModule, messagingModule, messaging };
                        setFb(fbObj);
                
                        const settingsRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general');
                        unsubscribeSettings.current = dbModule.onSnapshot(settingsRef, (snap) => {
                            if (snap.exists()) setAppSettings(snap.data());
                        });

                        // 🟢 新增：實時監聽 Firestore 推播歷史紀錄 (最新訊息置頂)
                        const notifCol = dbModule.collection(db, 'artifacts', appId, 'public', 'data', 'notifications');
                        const notifQuery = dbModule.query(notifCol, dbModule.orderBy('createdAt', 'desc'));
                        unsubscribeNotif.current = dbModule.onSnapshot(notifQuery, (snapshot) => {
                            const list = [];
                            snapshot.forEach(doc => {
                                list.push({ id: doc.id, ...doc.data() });
                            });
                            setNotificationsList(list);
                        }, (err) => {
                            console.warn("獲取歷史通知失敗，準備自動建立權限索引...", err);
                        });
                
                        unsubscribeAuth = authModule.onAuthStateChanged(auth, (user) => {
                            if (unsubscribeProfile.current) unsubscribeProfile.current();
                            if (unsubscribeProgress.current) unsubscribeProgress.current();
                
                            if (user) {
                                setCurrentUser(user);
                                if (user.email.endsWith(SITE_CONFIG.adminEmailDomain) && view !== 'admin-dashboard') setView('admin-dashboard');
                                
                                const profileRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', user.uid);
                                unsubscribeProfile.current = dbModule.onSnapshot(profileRef, (snap) => {
                                    if (snap.exists()) {
                                        const profile = snap.data();
                                        setUserProfile(profile);
                                        if (profile.notificationsEnabled) setPushSubscribed(true);
                                    } else if (user.email.endsWith(SITE_CONFIG.adminEmailDomain)) {
                                        setUserProfile({ username: user.email.split('@')[0], role: 'admin' });
                                    }
                                });
                
                                const progressRef = dbModule.doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'progress');
                                unsubscribeProgress.current = dbModule.onSnapshot(progressRef, (docSnap) => {
                                    let cloudDates = docSnap.exists() ? (docSnap.data().completedDates || []) : [];
                                    const userLocalKey = getLocalKey(user.uid);
                                    const localSaved = localStorage.getItem(userLocalKey);
                                    
                                    if (localSaved) {
                                        const localDates = JSON.parse(localSaved);
                                        const mergedDates = [...new Set([...cloudDates, ...localDates])].sort();
                                        if (mergedDates.length > cloudDates.length) {
                                            dbModule.setDoc(progressRef, { completedDates: mergedDates }, { merge: true });
                                            cloudDates = mergedDates;
                                        }
                                    }
                                    setCompleted(cloudDates);
                                    localStorage.setItem(userLocalKey, JSON.stringify(cloudDates));
                                });

                                autoSilentTokenRefresh(user, fbObj);

                            } else {
                                setCurrentUser(null); setUserProfile(null); setPushSubscribed(false);
                                const guestSaved = localStorage.getItem(getLocalKey(null));
                                setCompleted(guestSaved ? JSON.parse(guestSaved) : []); 
                                if (!new URLSearchParams(window.location.search).get('date')) goToCalendar();
                            }
                        });
                        
                        if (messaging) {
                            messagingModule.onMessage(messaging, (payload) => {
                                alert(`🔔 最新通知: ${payload.notification?.title || payload.data?.title}\n${payload.notification?.body || payload.data?.body}`);
                            });
                        }

                    } catch (e) { console.error("Firebase 模組載入失敗", e); }
                };
                initFirebase();

                return () => { 
                    if (unsubscribeAuth) unsubscribeAuth();
                    if (unsubscribeProgress.current) unsubscribeProgress.current(); 
                    if (unsubscribeSettings.current) unsubscribeSettings.current();
                    if (unsubscribeProfile.current) unsubscribeProfile.current();
                    if (unsubscribeNotif.current) unsubscribeNotif.current();
                };
            }, []);

            useEffect(() => {
                const load = async () => {
                    try {
                        const urlParams = new URLSearchParams(window.location.search);
                        const urlDate = urlParams.get('date');

                        const cachedStr = localStorage.getItem(SITE_CONFIG.cacheKey);
                        if (cachedStr) {
                            const cached = JSON.parse(cachedStr);
                            setDataByDate(cached.dataByDate || {});
                            setAllDates(cached.allDates || []);
                            if (urlDate && cached.dataByDate?.[urlDate]) {
                                goToDate(urlDate);
                                const parts = urlDate.split('-');
                                setCurrentViewMonth(new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1));
                            } else {
                                initViewMonth(cached.allDates || [], cached.dataByDate || {});
                            }
                            setLoading(false);
                        }

                        const { dataByDate: freshData, allDates: freshDates } = await loadAllContent();

                        setDataByDate(freshData);
                        setAllDates(freshDates);
                        localStorage.setItem(SITE_CONFIG.cacheKey, JSON.stringify({
                            dataByDate: freshData,
                            allDates: freshDates
                        }));

                        if (!cachedStr) {
                            if (urlDate && freshData[urlDate]) {
                                goToDate(urlDate);
                                const parts = urlDate.split('-');
                                setCurrentViewMonth(new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1));
                            } else {
                                initViewMonth(freshDates, freshData);
                            }
                        }
                        setLoading(false);
                    } catch (e) {
                        console.error(e);
                        if (Object.keys(dataByDate).length === 0) setError(e.message);
                        setLoading(false);
                    }
                };

                const initViewMonth = (dates, dataMap) => {
                    if (!dates || dates.length === 0) return;
                    const todayStr = getTodayStr();
                    let initialTarget = todayStr;
                    if (!dataMap[todayStr]) {
                        const past = dates.filter(d => d <= todayStr);
                        initialTarget = past.length > 0 ? past[past.length - 1] : dates[0];
                    }
                    const parts = initialTarget.split('-');
                    setCurrentViewMonth(new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1));
                };

                load();
            }, []);
                  
            const toggleFinish = async (dateStr) => {
                const isDone = completed.includes(dateStr);
                const next = isDone ? completed.filter(x => x !== dateStr) : [...completed, dateStr];
                
                setCompleted(next); 
                const uid = currentUser ? currentUser.uid : null;
                localStorage.setItem(getLocalKey(uid), JSON.stringify(next));
                
                if (currentUser && fb) {
                    setSyncing(true);
                    try {
                        const progressRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'users', currentUser.uid, 'data', 'progress');
                        await fb.dbModule.setDoc(progressRef, { completedDates: next }, { merge: true });
                        const profileRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', currentUser.uid);
                        await fb.dbModule.setDoc(profileRef, { completedCount: next.length, lastActive: new Date().toISOString() }, { merge: true });
                    } catch (e) { console.error("寫入雲端失敗", e); } finally { setSyncing(false); }
                }
            };

            const AuthModal = () => {
                const [step, setStep] = useState(1);
                const [username, setUsername] = useState('');
                const [selectedGroup, setSelectedGroup] = useState('');
                const [authError, setAuthError] = useState('');
                const [processing, setProcessing] = useState(false);

                if (!showAuthModal) return null;

                const handleAction = async (e) => {
                    e.preventDefault();
                    if (username.trim().length < 2) return setAuthError('代號請至少輸入兩個字');
                    setProcessing(true); setAuthError('');
                    const FIXED_PASS = "KccBible@2026_AutoPass";
                    const fakeEmail = `${username.trim().toLowerCase()}${SITE_CONFIG.pseudoEmailDomain}`;

                    try {
                        if (step === 1) {
                            try {
                                await fb.authModule.signInWithEmailAndPassword(fb.auth, fakeEmail, FIXED_PASS);
                                setShowAuthModal(false); 
                            } catch (err) { setStep(2); }
                        } else if (step === 2) {
                            if (!selectedGroup) { setAuthError('請選擇你所屬的小組'); setProcessing(false); return; }
                            const cred = await fb.authModule.createUserWithEmailAndPassword(fb.auth, fakeEmail, FIXED_PASS);
                            const guestSaved = localStorage.getItem(getLocalKey(null));

                            const profileRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', cred.user.uid);
                            await fb.dbModule.setDoc(profileRef, { username: username.trim(), group: selectedGroup, role: 'user', completedCount: initialProgress.length, createdAt: new Date().toISOString() });
                            
                            if (initialProgress.length > 0) {

                            setShowAuthModal(false);

                                <div><input type="password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-nature-500 text-xl tracking-widest text-center font-bold" required autoFocus /></div>
                                <div className="flex items-center justify-center mt-2"><input type="checkbox" id="regAdmin" checked={isRegister} onChange={(e) => setIsRegister(e.target.checked)} className="mr-2" /><label htmlFor="regAdmin" className="text-xs text-gray-500 cursor-pointer">首次使用</label></div>
                                <button type="submit" disabled={loading} className="w-full bg-gray-800 text-white font-bold py-4 rounded-xl hover:bg-gray-700 transition-all active:scale-95 text-lg">{loading ? <i className="fa-solid fa-spinner fa-spin"></i> : (isRegister ? '設定新密碼' : '安全登入')}</button>

            const AdminDashboard = () => {
                const [activeTab, setActiveTab] = useState('stats');

                const [usersList, setUsersList] = useState([]);
                const [loadingStats, setLoadingStats] = useState(false);

                useEffect(() => {
                    if (activeTab === 'stats' && fb && userProfile?.role === 'admin') {
                        setLoadingStats(true);
                        const fetchUsers = async () => {
                            try {
                                const usersCol = fb.dbModule.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles');
                                const snapshot = await fb.dbModule.getDocs(usersCol);
                                const list = [];
                                snapshot.forEach(doc => {
                                    const data = doc.data();
                                    if (data.role !== 'admin') list.push(data);

                                setUsersList(list);
                            } catch (e) {
                                console.error("獲取統計資料失敗:", e.message);

                                setLoadingStats(false);
                            }

                    }
                }, [activeTab, fb, userProfile]);

                const handleAddGroup = async () => {
                    if (!newGroup.trim() || appSettings.groups.includes(newGroup.trim())) return;
                    const updated = [...appSettings.groups, newGroup.trim()];
                    const settingsRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'settings', 'general');
                    await fb.dbModule.setDoc(settingsRef, { groups: updated }, { merge: true });
                    setNewGroup('');
                };

                const handleRemoveGroup = async (groupName) => {
                    if (!confirm(`確定要刪除小組「${groupName}」嗎？`)) return;
                    const updated = appSettings.groups.filter(g => g !== groupName);
                    const settingsRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'settings', 'general');
                    await fb.dbModule.setDoc(settingsRef, { groups: updated }, { merge: true });
                };

                const handleExportCSV = () => {
                    if (usersList.length === 0) {
                        alert("目前沒有數據可供匯出。");
                        return;
                    }
                    const headers = ['小組/牧區', '姓名/代號', '已讀天數', '最後活動日期', '註冊日期', '已開啟推播通知'];
                    const rows = usersList.map(user => [
                        user.group || '未分類',
                        user.username || '無名',
                        user.completedCount || 0,
                        user.lastActive ? user.lastActive.substring(0, 10) : '無紀錄',
                        user.createdAt ? user.createdAt.substring(0, 10) : '無紀錄',
                        user.notificationsEnabled ? '是' : '否'
                    ]);
                    const csvContent = [
                        headers.join(','),
                        ...rows.map(row => row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(','))
                    ].join('\n');
                    const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                    const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                    const link = document.createElement('a');
                    const url = URL.createObjectURL(blob);
                    const today = new Date();
                    const dateStr = `${today.getFullYear()}${(today.getMonth()+1).toString().padStart(2, '0')}${today.getDate().toString().padStart(2, '0')}`;
                    link.setAttribute('href', url);
                    link.setAttribute('download', `葵涌堂_讀經進度統計_${dateStr}.csv`);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);

                const groupedStats = usersList.reduce((acc, user) => {
                    const group = user.group || '未分類';

                return (
                    <div className="max-w-5xl mx-auto w-full animate-fade-in bg-white rounded-3xl shadow-soft border border-gray-100 overflow-hidden min-h-[60vh]">
                        <div className="bg-gray-900 text-white p-6 md:p-8 flex justify-between items-center">
                            <div><h2 className="text-2xl font-bold font-serif mb-1"><i className="fa-solid fa-server mr-2 text-nature-400"></i> 教會讀經後台系統</h2><p className="text-gray-400 text-sm">管理員：{userProfile?.username}</p></div>
                            <button onClick={goToCalendar} className="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm transition font-bold border border-gray-700">返回前台</button>

                        <div className="flex border-b border-gray-200">
                            <button onClick={() => setActiveTab('stats')} className={`flex-1 py-4 font-bold transition ${activeTab === 'stats' ? 'bg-nature-50 text-nature-700 border-b-2 border-nature-600' : 'text-gray-500 hover:bg-gray-50'}`}><i className="fa-solid fa-chart-pie mr-2"></i> 參與統計</button>
                            <button onClick={() => setActiveTab('settings')} className={`flex-1 py-4 font-bold transition ${activeTab === 'settings' ? 'bg-nature-50 text-nature-700 border-b-2 border-nature-600' : 'text-gray-500 hover:bg-gray-50'}`}><i className="fa-solid fa-users-gear mr-2"></i> 小組設定</button>
                        </div>

                        <div className="p-6 md:p-8 bg-gray-50 min-h-[400px]">
                            {activeTab === 'settings' && (
                                <div className="max-w-2xl mx-auto space-y-8">

                                        <div className="flex gap-2">

                                            <button onClick={handleAddGroup} className="bg-nature-600 text-white px-6 font-bold rounded-xl hover:bg-nature-700 transition">新增</button>

                                        </div>
                                    </div>

                                    ) : (
                                        <div className="space-y-6">
                                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 md:px-6 rounded-2xl shadow-sm border border-nature-100 mb-6 gap-4">
                                                <div><h3 className="font-bold text-nature-800 text-lg">全教會參與數據</h3><p className="text-xs text-gray-400 mt-1">目前共有 {usersList.length} 位參與者</p></div>
                                                <button onClick={handleExportCSV} disabled={usersList.length === 0} className="w-full md:w-auto bg-nature-600 hover:bg-nature-700 text-white px-5 py-2.5 rounded-xl font-bold transition-all shadow-md active:scale-95 disabled:opacity-50 flex items-center justify-center">

                                                </button>

                                            {Object.keys(groupedStats).length === 0 ? (
                                                <div className="text-center py-10 text-gray-400 bg-white rounded-2xl border border-dashed border-gray-200">目前還沒有任何使用者註冊記錄。</div>

                                                            <span className="bg-nature-600 text-white text-xs px-2 py-1 rounded-full font-bold">{groupedStats[groupName].length} 人</span>
                                                        </div>
                                                        <div className="divide-y divide-gray-100">
                                                            {groupedStats[groupName].sort((a,b) => (b.completedCount||0) - (a.completedCount||0)).map((user, idx) => (
                                                                <div key={idx} className="flex justify-between items-center p-4 hover:bg-gray-50 transition">

            if (loading) return (

            );

            const renderCalendarView = () => {
                const year = currentViewMonth.getFullYear();
                const month = currentViewMonth.getMonth();
                const firstDayOfMonth = new Date(year, month, 1);
                const lastDayOfMonth = new Date(year, month + 1, 0);
                const grid = [];
                let currentWeek = [];
                for (let i = 0; i < firstDayOfMonth.getDay(); i++) currentWeek.push(null);
                for (let d = 1; d <= lastDayOfMonth.getDate(); d++) {
                    const currentDate = new Date(year, month, d);
                    currentWeek.push(currentDate);
                    if (currentDate.getDay() === 6 || d === lastDayOfMonth.getDate()) {
                        while (currentWeek.length < 7) currentWeek.push(null);
                        grid.push(currentWeek); currentWeek = [];
                    }
                }
                const handleGoToday = () => {
                    const todayStr = getTodayStr();
                    let targetDate = (validDates.includes(todayStr) || eventData[todayStr] || devotionData[todayStr]) ? todayStr : null;
                    if (!targetDate) {
                        const pastDates = [...validDates, ...Object.keys(eventData), ...Object.keys(devotionData)].filter(d => d <= todayStr).sort();
                        targetDate = pastDates.length > 0 ? pastDates[pastDates.length - 1] : (validDates[0] || Object.keys(eventData)[0] || Object.keys(devotionData)[0]);
                    }
                    if(targetDate){
                        const parts = targetDate.split('-'); setCurrentViewMonth(new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1)); goToDate(targetDate);
                    }
                };

                return (
                    <div className="max-w-4xl mx-auto w-full animate-fade-in">
                        <div className="flex justify-center mb-8">
                            <button onClick={handleGoToday} className="px-8 py-4 bg-white border-2 border-nature-600 text-nature-700 hover:bg-nature-600 hover:text-white rounded-full font-bold shadow-lg flex items-center transition-all group active:scale-95">
                                <i className="fa-solid fa-book-open-reader mr-3 text-nature-500 group-hover:text-white transition-colors"></i> <span className="text-lg">進入今日閱讀與動態</span>

                            <div className="space-y-4">
                                {notificationsList.map((item) => {
                                    const dateStr = item.createdAt ? new Date(item.createdAt).toLocaleString('zh-HK', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
                                    
                                    return (
                                        <article key={item.id} className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/80 hover:border-nature-300 transition relative overflow-hidden group">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-bold text-slate-800 text-lg flex items-center">
                                                    <span className="w-2.5 h-2.5 rounded-full bg-nature-500 mr-2 shrink-0"></span>
                                                    {item.title || '最新通告'}
                                                </h3>
                                                <span className="text-xs font-sans text-slate-400 bg-slate-100 px-2.5 py-1 rounded-full shrink-0">
                                                    {dateStr}
                                                </span>
                                            </div>
                                            
                                            <p className="text-slate-600 leading-relaxed text-sm whitespace-pre-wrap pl-4 border-l-2 border-slate-100 my-3">
                                                {item.body}
                                            </p>

                                            {item.url && (
                                                <div className="pt-2 flex justify-end">
                                                    <button 
                                                        onClick={() => {
                                                            if (item.url.startsWith('?date=')) {
                                                                goToDate(item.url.replace('?date=', ''));
                                                            } else {
                                                                window.open(item.url, '_blank');
                                                            }
                                                        }}
                                                        className="text-xs bg-nature-50 text-nature-700 hover:bg-nature-100 font-bold px-4 py-2 rounded-xl transition flex items-center"
                                                    >
                                                        開啟相關專頁 <i className="fa-solid fa-arrow-right ml-1.5 text-[10px]"></i>
                                                    </button>
                                                </div>
                                            )}
                                        </article>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <>
                    <AuthModal />
                    <AdminLoginModal />
                    {renderDevotionModal()} 
                    
                    <header className="bg-white/80 backdrop-blur-lg border-b border-slate-200 shadow-sm sticky top-0 z-40">
                        {isOffline && <div className="bg-amber-100 text-amber-800 text-xs text-center py-1.5 font-bold">目前處於離線模式</div>}
                        <div className="max-w-5xl mx-auto px-4 py-4 md:py-5 flex justify-between items-center gap-2">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-nature-600 rounded-lg flex items-center justify-center text-white" onClick={goToCalendar}><i className="fa-solid fa-cross text-xl"></i></div>
                                <div><h1 className="text-xl font-bold text-slate-800">{SITE_CONFIG.titleLine2}</h1></div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                {/* 🟢 新增：歷史通知訊息牆按鈕 (預設永遠顯示) */}
                                <button 
                                    onClick={() => setView('notifications')} 
                                    className={`relative p-2.5 rounded-full transition ${view === 'notifications' ? 'bg-nature-600 text-white shadow-md' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                                    title="訊息中心"
                                >
                                    <i className="fa-solid fa-bell text-base md:text-lg"></i>
                                    {notificationsList.length > 0 && (
                                        <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm">
                                            {notificationsList.length}
                                        </span>
                                    )}
                                </button>

                                {fb && currentUser ? (
                                    <div className="group relative z-50">
                                        <button className="flex items-center gap-2 border px-3 py-1.5 rounded-full text-xs md:text-sm font-bold shadow-sm bg-emerald-50 text-emerald-800 border-emerald-300 relative z-50">
                                            <i className="fa-solid fa-cloud-check"></i> <span>{currentUser.email.split('@')[0]}</span>
                                        </button>
                                        <div className="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border border-slate-200 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all overflow-hidden z-50">
                                            {userProfile?.role === 'admin' && <button onClick={()=>setView('admin-dashboard')} className="w-full text-left px-4 py-3 text-sm text-slate-700 hover:bg-slate-50 font-bold border-b border-slate-100"><i className="fa-solid fa-server mr-2"></i> 進入後台</button>}
                                            
                                            <button 
                                                onClick={togglePushSubscription} 
                                                className={`w-full text-left px-4 py-3 text-sm font-bold border-b border-slate-100 flex items-center justify-between transition ${
                                                    pushSubscribed ? 'text-amber-600 hover:bg-amber-50' : 'text-blue-600 hover:bg-blue-50'
                                                }`}
                                            >
                                                <span>
                                                    <i className={`fa-solid ${pushSubscribed ? 'fa-bell-slash' : 'fa-bell'} mr-2`}></i>
                                                    {pushSubscribed ? '取消推播通知' : '啟用推播通知'}
                                                </span>
                                                {pushSubscribed && <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">運行中</span>}
                                            </button>

                                            <button onClick={()=>{ setCompleted([]); setCurrentUser(null); setUserProfile(null); goToCalendar(); fb.authModule.signOut(fb.auth); }} className="w-full text-left px-4 py-3 text-sm text-red-600 hover:bg-red-50 font-bold"><i className="fa-solid fa-arrow-right-from-bracket mr-2"></i> 登出帳號</button>
                                        </div>
                                    </div>
                                ) : fb ? (
                                    <button onClick={() => setShowAuthModal(true)} className="flex items-center gap-2 bg-white border border-slate-300 px-3 py-1.5 rounded-full text-xs font-bold"><i className="fa-solid fa-cloud-arrow-up"></i> 登入</button>
                                ) : null}
                            </div>
                        </div>
                    </header>

                    {view === 'calendar' && (
                        <div className="bg-gradient-to-br from-nature-800 to-nature-600 text-white py-10 px-4 shadow-xl text-center"><h1 className="text-3xl font-bold">{SITE_CONFIG.titleLine1}</h1><p className="text-xl italic text-nature-200 mt-4">{SITE_CONFIG.subtitle}</p></div>
                    )}

                    <main className="flex-grow py-8 px-4 w-full bg-slate-200/70 relative z-0">
                        {view === 'admin-dashboard' && userProfile?.role === 'admin' ? (
                            <AdminDashboard />
                        ) : view === 'notifications' ? (
                            renderNotificationsView()
                        ) : view === 'reader' && selectedDate ? (
                            renderReaderView()
                        ) : (
                            renderCalendarView()
                        )}
                    </main>

                    <footer className="py-10 bg-slate-800 border-t border-slate-900 text-center text-slate-400 mt-auto">
                        <div className="flex justify-center items-center gap-4 opacity-50 text-[10px] uppercase mb-6">
                            <p>{SITE_CONFIG.footerText}</p>
                            {!currentUser && completed.length > 0 && <button onClick={handleClearGuestProgress} className="text-slate-400 hover:text-red-400" title="清除本機紀錄"><i className="fa-solid fa-trash-can"></i></button>}
                            {!currentUser && <button onClick={() => setShowAdminLogin(true)} className="text-slate-400" title="管理員"><i className="fa-solid fa-lock"></i></button>}
                        </div>
                    </footer>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=260821_enhance1')
                    .then(registration => {
                        console.log('✅ PWA 全能超級大腦 (SW) 啟動成功');
                        registration.update();
                        let refreshing;
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            if (refreshing) return;
                            refreshing = true;
                            window.location.reload();
                        });
                    })
                    .catch(err => { console.warn('❌ PWA 引擎啟動失敗: ', err); });
            });
        }
    </script>
</body>
</html>
