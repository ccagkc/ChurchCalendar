    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const SITE_CONFIG = {
            SPREADSHEET_ID: '1_FfNhrUwgI3l0vOpDqWfooAVQUja-Sl-YQOna3nJyQo', 
            SHEET_NAME: 'ReadBible',
            EVENT_SHEET_NAME: 'Event', 
            DEVOTION_SHEET_NAME: 'Devotion', // 💡 新增靈修分頁設定
            titleLine1: "剛強壯膽 · 踐信力行",
            titleLine2: "葵涌堂悅曆",

            storageKey: "ccagkc-calendar-progress-v1",
            cacheKey: "ccagkc-calendar-cache-v2", // 💡 升級快取以納入靈修資料
            pseudoEmailDomain: "@kcc.bible.app",
            adminEmailDomain: "@admin.kcc.app"
        };
        
        const formatDate = (dateObj) => {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        const getTodayStr = () => formatDate(new Date());

        const parseExternalLink = (url, type = 'doc') => {
            if (!url || typeof url !== 'string' || url.trim() === '') return null;
            if (!url.includes('google.com')) return { type: 'raw', url };
            const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (!idMatch) return { type: 'raw', url };
            const id = idMatch[1];
            return { type: 'embed', url: `https://docs.google.com/document/d/${id}/preview` };
        };

        // 💡 專家升級：專門將 Google Drive 檔案轉換為原生音訊/圖片下載流，打破 iframe 無法自動播放的限制
        const parseDriveNativeUrl = (url) => {
            if (!url) return null;
            let finalUrl = String(url).trim();
            if (!finalUrl.startsWith('http')) return null;
            let fileId = null;
            if (finalUrl.includes('drive.google.com/file/d/')) {
                const match = finalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match) fileId = match[1];
            } else if (finalUrl.includes('drive.google.com/open') || finalUrl.includes('drive.google.com/uc')) {
                const match = finalUrl.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match) fileId = match[1];
            }
            if (fileId) {
                return `https://drive.google.com/uc?export=download&id=${fileId}`;
            }
            return finalUrl;
        };

        const parseCSV = (str) => {
            const arr = [];
            let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || "";
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        };

        const App = () => {
            const [view, setView] = useState('calendar'); 
            const [selectedDate, setSelectedDate] = useState(null);
            const [currentViewMonth, setCurrentViewMonth] = useState(new Date()); 
            const [showAnswer, setShowAnswer] = useState(false);
            
            // 💡 新增靈修 Modal 控制狀態
            const [devotionModalOpen, setDevotionModalOpen] = useState(false);
            const devotionAudioRef = useRef(null);
            
            const [data, setData] = useState({}); 
            const [eventData, setEventData] = useState({}); 
            const [devotionData, setDevotionData] = useState({}); // 💡 新增靈修資料庫
            
            const [validDates, setValidDates] = useState([]); 
            const [completed, setCompleted] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const [appSettings, setAppSettings] = useState({ groups: ['未入組/其他', '少年崇拜', '奇行組', 'IMA組', '加利利奮青', '彼得組', '隨意行組', '葡萄果組', 
                                                                      'Spectrum組', '家靈一組', '7-11組', '清心組', 'ReConnect組', '基順ECO組', '蜜組', '喜樂組'] });
            const [userProfile, setUserProfile] = useState(null);
            
            const [fb, setFb] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [syncing, setSyncing] = useState(false);

            const [isOffline, setIsOffline] = useState(!navigator.onLine);
            const [fontScale, setFontScale] = useState(() => {
                return parseInt(localStorage.getItem('kcc_font_scale')) || 0;
            });

            let unsubscribeProgress = useRef(null);
            let unsubscribeSettings = useRef(null);
            let unsubscribeProfile = useRef(null);

            // 💡 專家控制：當打開靈修視窗時自動播放音樂；關閉時自動停止並歸零
            useEffect(() => {
                if (devotionModalOpen && devotionAudioRef.current) {
                    const playPromise = devotionAudioRef.current.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(e => console.log("瀏覽器阻擋自動播放，需使用者互動:", e));
                    }
                } else if (!devotionModalOpen && devotionAudioRef.current) {
                    devotionAudioRef.current.pause();
                    devotionAudioRef.current.currentTime = 0;
                }
            }, [devotionModalOpen]);

            const goToCalendar = () => {
                setView('calendar');
                setShowAnswer(false);
                setDevotionModalOpen(false);
                window.scrollTo(0,0);
                window.history.replaceState(null, '', window.location.pathname);
            };

            const goToDate = (dateStr) => {
                setSelectedDate(dateStr);
                setShowAnswer(false);
                window.scrollTo(0,0);
                window.history.replaceState(null, '', `?date=${dateStr}`);
                
                // 💡 智慧路由：判斷今日的內容組成
                const dayHasBible = validDates.includes(dateStr);
                const dayHasEvent = (eventData[dateStr] || []).length > 0;
                const dayHasDevotion = !!devotionData[dateStr];

                // 若只有靈修內容，自動略過讀經頁面，直接開啟靈修全螢幕
                if (!dayHasBible && !dayHasEvent && dayHasDevotion) {
                    setView('reader'); 
                    setDevotionModalOpen(true);
                } else {
                    setView('reader');
                    setDevotionModalOpen(false);
                }
            };

            const toggleFontScale = () => {
                const nextScale = (fontScale + 1) % 3;
                setFontScale(nextScale);
                localStorage.setItem('kcc_font_scale', nextScale);
            };

            useEffect(() => {
                const handleOnline = () => setIsOffline(false);
                const handleOffline = () => setIsOffline(true);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);
                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                };
            }, []);

            useEffect(() => {
                let unsubscribeAuth = null;
                const initFirebase = async () => {
                    try {
                        const appModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                        const authModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
                        const dbModule = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                
                        const firebaseConfig = {
                            apiKey: "AIzaSyAEMB-eVojfzcUMyKt9JgGK_okPRO2V73g",
                            authDomain: "ccagkc-biblereading-project.firebaseapp.com",
                            databaseURL: "https://ccagkc-biblereading-project-default-rtdb.asia-southeast1.firebasedatabase.app",
                            projectId: "ccagkc-biblereading-project",
                            storageBucket: "ccagkc-biblereading-project.firebasestorage.app",
                            messagingSenderId: "962459311265",
                            appId: "1:962459311265:web:cbad43a46491a046e5e4e0"
                        };
                        
                        const app = appModule.initializeApp(firebaseConfig);
                        const auth = authModule.getAuth(app);
                        const db = dbModule.getFirestore(app);
                        const appId = 'ccagkc-ChurchCalendarApp'; 
                
                        setFb({ auth, db, appId, authModule, dbModule });
                
                        const settingsRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'general');
                        unsubscribeSettings.current = dbModule.onSnapshot(settingsRef, (snap) => {
                            if (snap.exists()) setAppSettings(snap.data());
                        });
                
                        unsubscribeAuth = authModule.onAuthStateChanged(auth, (user) => {
                            if (unsubscribeProfile.current) unsubscribeProfile.current();
                            if (unsubscribeProgress.current) unsubscribeProgress.current();
                
                            if (user) {
                                setCurrentUser(user);
                                if (user.email.endsWith(SITE_CONFIG.adminEmailDomain) && view !== 'admin-dashboard') {
                                    setView('admin-dashboard');
                                }
                                
                                const profileRef = dbModule.doc(db, 'artifacts', appId, 'public', 'data', 'userProfiles', user.uid);
                                unsubscribeProfile.current = dbModule.onSnapshot(profileRef, (snap) => {
                                    if (snap.exists()) {
                                        setUserProfile(snap.data());
                                    } else if (user.email.endsWith(SITE_CONFIG.adminEmailDomain)) {
                                        setUserProfile({ username: user.email.split('@')[0], role: 'admin' });
                                    }
                                });
                
                                const progressRef = dbModule.doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'progress');
                                unsubscribeProgress.current = dbModule.onSnapshot(progressRef, (docSnap) => {
                                    if (docSnap.exists()) setCompleted(docSnap.data().completedDates || []);
                                });
                            } else {
                                setCurrentUser(null);
                                setUserProfile(null);
                                setCompleted([]); 
                                if (!new URLSearchParams(window.location.search).get('date')) goToCalendar();
                            }
                        });
                    } catch (e) {
                        console.error("Firebase 模組載入失敗", e);
                    }
                };
                initFirebase();

                return () => { 
                    if (unsubscribeAuth) unsubscribeAuth();
                    if (unsubscribeProgress.current) unsubscribeProgress.current(); 
                    if (unsubscribeSettings.current) unsubscribeSettings.current();
                    if (unsubscribeProfile.current) unsubscribeProfile.current();
                };
            }, []);

            useEffect(() => {
                const fetchSheetData = async () => {
                    try {
                        const urlParams = new URLSearchParams(window.location.search);
                        const urlDate = urlParams.get('date');

                        const cachedDataStr = localStorage.getItem(SITE_CONFIG.cacheKey);
                        if (cachedDataStr) {
                            const cached = JSON.parse(cachedDataStr);
                            setData(cached.bible);
                            setEventData(cached.events);
                            setDevotionData(cached.devotion || {}); // 載入靈修快取
                            setValidDates(cached.datesArray);
                            
                            if (urlDate && (cached.bible[urlDate] || cached.events[urlDate] || (cached.devotion && cached.devotion[urlDate]))) {
                                // 將邏輯委派給 goToDate，以處理自動彈出靈修判斷
                                goToDate(urlDate);
                                const parts = urlDate.split('-');
                                setCurrentViewMonth(new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1));
                            } else {
                                initViewMonth(cached.datesArray, cached.bible, cached.devotion);
                            }
                            setLoading(false); 
                        }

                        const bibleUrl = `https://docs.google.com/spreadsheets/d/${SITE_CONFIG.SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SITE_CONFIG.SHEET_NAME)}`;
                        const eventUrl = `https://docs.google.com/spreadsheets/d/${SITE_CONFIG.SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SITE_CONFIG.EVENT_SHEET_NAME)}`;
                        const devotionUrl = `https://docs.google.com/spreadsheets/d/${SITE_CONFIG.SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SITE_CONFIG.DEVOTION_SHEET_NAME)}`;

                        const [bibleResp, eventResp, devResp] = await Promise.all([
                            fetch(bibleUrl).catch(() => null),
                            fetch(eventUrl).catch(() => null),
                            fetch(devotionUrl).catch(() => null)
                        ]);

                        if (!bibleResp || !bibleResp.ok) {
                            if (!cachedDataStr) throw new Error("無法連接到讀經資料庫。請確認網路連線。");
                            return; 
                        }
                        
                        // Parse Bible
                        const bibleText = await bibleResp.text();
                        const bibleRows = parseCSV(bibleText);
                        const items = {};
                        const datesArray = [];
                        if (bibleRows.length >= 2) {
                            const headers = bibleRows[0].map(h => h.trim());
                            for(let i=1; i<bibleRows.length; i++) {
                                const row = bibleRows[i];
                                if (!row || row.length < 2) continue;
                                const item = {};
                                headers.forEach((h, idx) => item[h] = row[idx]);
                                if(item['日期']) {
                                    const dateStr = item['日期'].replace(/\//g, '-').split(' ')[0];
                                    const parts = dateStr.split('-');
                                    if (parts.length === 3) {
                                        const stdDate = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
                                        items[stdDate] = item;
                                        if (!datesArray.includes(stdDate)) datesArray.push(stdDate);
                                    }
                                }
                            }
                            datesArray.sort();
                        }
                        
                        // Parse Events
                        const events = {};
                        if (eventResp && eventResp.ok) {
                            const eventText = await eventResp.text();
                            const eventRows = parseCSV(eventText);
                            if (eventRows.length >= 2) {
                                const eHeaders = eventRows[0].map(h => h.trim());
                                for(let i=1; i<eventRows.length; i++) {
                                    const row = eventRows[i];
                                    if (!row || row.length < 2) continue;
                                    const item = {};
                                    eHeaders.forEach((h, idx) => item[h] = row[idx]);
                                    if(item['日期']) {
                                        const dateStr = item['日期'].replace(/\//g, '-').split(' ')[0];
                                        const parts = dateStr.split('-');
                                        if (parts.length === 3) {
                                            const stdDate = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
                                            if (!events[stdDate]) events[stdDate] = [];
                                            events[stdDate].push(item);
                                        }
                                    }
                                }
                            }
                        }

                        // Parse Devotion
                        const devData = {};
                        if (devResp && devResp.ok) {
                            const devText = await devResp.text();
                            const devRows = parseCSV(devText);
                            if (devRows.length >= 2) {
                                const dHeaders = devRows[0].map(h => h.trim());
                                for(let i=1; i<devRows.length; i++) {
                                    const row = devRows[i];
                                    if (!row || row.length < 2) continue;
                                    const item = {};
                                    dHeaders.forEach((h, idx) => item[h] = row[idx]);
                                    if(item['日期']) {
                                        const dateStr = item['日期'].replace(/\//g, '-').split(' ')[0];
                                        const parts = dateStr.split('-');
                                        if (parts.length === 3) {
                                            const stdDate = `${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`;
                                            devData[stdDate] = item;
                                        }
                                    }
                                }
                            }
                        }
                        
                        setData(items);
                        setEventData(events);
                        setDevotionData(devData);
                        setValidDates(datesArray);
                        localStorage.setItem(SITE_CONFIG.cacheKey, JSON.stringify({ bible: items, events: events, devotion: devData, datesArray: datesArray }));
                        
                        if (!cachedDataStr) {
                            if (urlDate && (items[urlDate] || events[urlDate] || devData[urlDate])) {
                                goToDate(urlDate);
                                const parts = urlDate.split('-');
                                setCurrentViewMonth(new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1));
                            } else {
                                initViewMonth(datesArray, items, devData);
                            }
                        }
                        setLoading(false);

                    } catch (e) {
                        if (!data || Object.keys(data).length === 0) setError(e.message);
                        setLoading(false);
                    }
                };

                const initViewMonth = (dates, items, devData) => {
                    const allDates = [...dates, ...Object.keys(devData || {})];
                    if (allDates.length > 0) {
                        const todayStr = getTodayStr();
                        let initialTarget = todayStr;
                        if (!items[todayStr] && !(devData && devData[todayStr])) {
                            const pastDates = allDates.filter(d => d <= todayStr).sort();
                            initialTarget = pastDates.length > 0 ? pastDates[pastDates.length - 1] : allDates[0];
                        }
                        const parts = initialTarget.split('-');
                        setCurrentViewMonth(new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 1));
                    }
                };

                fetchSheetData();
            }, []);
            
            const toggleFinish = async (dateStr) => {
                const isDone = completed.includes(dateStr);
                const next = isDone ? completed.filter(x => x !== dateStr) : [...completed, dateStr];
                
                setCompleted(next); 
                
                if (currentUser && fb) {
                    setSyncing(true);
                    try {
                        const progressRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'users', currentUser.uid, 'data', 'progress');
                        await fb.dbModule.setDoc(progressRef, { completedDates: next }, { merge: true });
                        
                        const profileRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', currentUser.uid);
                        await fb.dbModule.setDoc(profileRef, { 
                            completedCount: next.length,
                            lastActive: new Date().toISOString()
                        }, { merge: true });

                    } catch (e) {
                        console.error("寫入雲端失敗 (請確認權限設定)", e);
                    } finally {
                        setSyncing(false);
                    }
                } else if (fb && !currentUser) {
                    setShowAuthModal(true);
                }
            };

            const AuthModal = () => { /* 保持不變，為節省篇幅予以省略...但因要求完全覆蓋，以下照常列出 */
                const [step, setStep] = useState(1);
                const [username, setUsername] = useState('');
                const [selectedGroup, setSelectedGroup] = useState('');
                const [authError, setAuthError] = useState('');
                const [processing, setProcessing] = useState(false);

                if (!showAuthModal) return null;

                const handleAction = async (e) => {
                    e.preventDefault();
                    if (username.trim().length < 2) return setAuthError('代號請至少輸入兩個字');
                    setProcessing(true);
                    setAuthError('');
                    const FIXED_PASS = "KccBible@2026_AutoPass";
                    const fakeEmail = `${username.trim().toLowerCase()}${SITE_CONFIG.pseudoEmailDomain}`;

                    try {
                        if (step === 1) {
                            try {
                                await fb.authModule.signInWithEmailAndPassword(fb.auth, fakeEmail, FIXED_PASS);
                                setShowAuthModal(false); 
                            } catch (err) { setStep(2); }
                        } else if (step === 2) {
                            if (!selectedGroup) {
                                setAuthError('請選擇你所屬的小組');
                                setProcessing(false);
                                return;
                            }
                            const cred = await fb.authModule.createUserWithEmailAndPassword(fb.auth, fakeEmail, FIXED_PASS);
                            const profileRef = fb.dbModule.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'userProfiles', cred.user.uid);
                            await fb.dbModule.setDoc(profileRef, { username: username.trim(), group: selectedGroup, role: 'user', completedCount: 0, createdAt: new Date().toISOString() });
                            setShowAuthModal(false);
                        }

                                    <h1 className="text-3xl md:text-5xl font-bold leading-tight drop-shadow-lg">{dev['內頁標題']}</h1>
                                </div>
                            </div>
                        ) : (
                            <div className="bg-gradient-to-br from-stone-800 to-stone-900 p-8 md:p-12 text-white">
                                <div className="text-purple-300 font-sans font-bold tracking-[0.2em] mb-3 text-sm"><i className="fa-solid fa-dove mr-2"></i>{dev['類別'] || '每日靈修'}</div>
                                <h1 className="text-3xl md:text-5xl font-bold leading-tight">{dev['內頁標題']}</h1>
                            </div>
                        )}

                        <div className="max-w-3xl mx-auto w-full px-6 py-10 md:py-16 space-y-12 flex-grow">
                            
                            {/* 音訊播放器 (自動播放) */}
                            {devotionAudioUrl && (
                                <div className="bg-white p-5 rounded-3xl shadow-sm border border-stone-200 flex flex-col items-center sticky top-20 z-40">
                                    <div className="text-stone-500 font-sans text-xs font-bold uppercase tracking-widest mb-3 flex items-center"><i className="fa-solid fa-headphones mr-2 text-purple-500"></i>聆聽靈修音訊</div>
                                    <audio ref={devotionAudioRef} controls className="w-full h-10 outline-none rounded-full"><source src={devotionAudioUrl} /></audio>
                                </div>
                            )}

                            {/* 經文默想 */}
                            {dev['默想經文'] && (
                                <div className={`relative px-8 py-6 bg-purple-50/50 rounded-3xl border-l-4 border-purple-500 text-stone-800 leading-loose whitespace-pre-wrap ${currentFontClass}`}>
                                    <i className="fa-solid fa-quote-left absolute top-4 left-4 text-4xl text-purple-200 opacity-50"></i>
                                    <div className="relative z-10 font-bold">{dev['默想經文']}</div>
                                </div>
                            )}

                            {/* 靈修內容主體 */}
                            {dev['靈修內容'] && (
                                <div>
                                    <h3 className="font-sans font-bold text-stone-400 uppercase tracking-widest text-sm mb-6 flex items-center"><i className="fa-solid fa-book-open mr-2"></i> 信息內容</h3>
                                    <div className={`text-stone-700 leading-[2.2] whitespace-pre-wrap ${currentFontClass}`}>{dev['靈修內容']}</div>
                                </div>
                            )}

                            {/* 默想問題 */}
                            {dev['默想'] && (
                                <div className="bg-stone-100 p-8 md:p-10 rounded-[2.5rem] border border-stone-200 shadow-inner">
                                    <h3 className="font-sans font-bold text-stone-500 uppercase tracking-widest text-sm mb-6 flex items-center"><i className="fa-solid fa-seedling mr-2 text-emerald-600"></i> 沉澱與默想</h3>
                                    <div className={`text-stone-800 leading-relaxed font-bold whitespace-pre-wrap ${currentFontClass}`}>{dev['默想']}</div>
                                </div>
                            )}

                            {/* 祈禱 */}
                            {dev['禱告'] && (
                                <div className="pt-8 border-t-2 border-stone-200/60 pb-10">
                                    <h3 className="font-sans font-bold text-stone-400 uppercase tracking-widest text-sm mb-6 flex items-center"><i className="fa-solid fa-hands-praying mr-2 text-blue-500"></i> 我們的禱告</h3>
                                    <div className={`text-stone-600 italic leading-loose whitespace-pre-wrap ${currentFontClass}`}>「{dev['禱告']}」</div>
                                </div>
                            )}

                            {/* 底部關閉鈕 */}
                            <button onClick={() => setDevotionModalOpen(false)} className="w-full py-5 bg-stone-800 text-white rounded-2xl font-sans font-bold text-lg shadow-lg active:scale-95 transition-all"><i className="fa-solid fa-check mr-2"></i> 完成靈修並返回</button>
                        </div>
                    </div>
                );
            };

            return (
                <>
                    <AuthModal />
                    <AdminLoginModal />
                    {renderDevotionModal()} {/* 💡 插入全螢幕靈修視窗元件 */}
                    
                    <header className="bg-white/80 backdrop-blur-lg border-b border-slate-200 shadow-sm sticky top-0 z-40">
                        {isOffline && (
                            <div className="bg-amber-100 text-amber-800 text-xs text-center py-1.5 font-bold animate-fade-in-down border-b border-amber-200 flex justify-center items-center">
                                <i className="fa-solid fa-cloud-arrow-down mr-2"></i> 目前處於離線模式，正在顯示手機快取資料
                            </div>
                        )}
                        <div className="max-w-5xl mx-auto px-4 py-4 md:py-5 flex justify-between items-center gap-2">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-nature-600 rounded-lg flex items-center justify-center text-white shadow-md transform -rotate-3 cursor-pointer" onClick={goToCalendar}><i className="fa-solid fa-cross text-xl"></i></div>
                                <div><h1 className="text-xl md:text-2xl font-bold text-slate-800 tracking-tight">{SITE_CONFIG.titleLine2}</h1></div>
                            </div>
                        </div>
                    </header>

                    {view === 'calendar' && (
                        <div className="bg-gradient-to-br from-nature-800 to-nature-600 text-white py-10 px-4 shadow-xl text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none"><i className="fa-solid fa-seedling text-[15rem] -ml-10 -mt-10"></i></div>
                            <h1 className="text-3xl md:text-5xl font-bold mb-2 relative z-10 tracking-tight">{SITE_CONFIG.titleLine1}</h1>
                            <p className="text-xl md:text-2xl font-serif italic text-nature-200 mb-4 relative z-10 mt-4">{SITE_CONFIG.subtitle}</p>
                            <p className="text-nature-100 opacity-90 relative z-10 font-medium whitespace-pre-wrap leading-relaxed">{SITE_CONFIG.description}</p>
                        </div>
                    )}

                    <main className="flex-grow py-8 px-4 w-full bg-slate-200/70">
                        {view === 'admin-dashboard' && userProfile?.role === 'admin' ? <AdminDashboard /> : view === 'reader' && selectedDate ? renderReaderView() : renderCalendarView()}
                    </main>

                    <footer className="py-10 bg-slate-800 border-t border-slate-900 text-center text-slate-400 tracking-widest mt-auto">
                        <p className="mb-2 text-slate-300 text-xs uppercase"><i className="fa-solid fa-seedling mr-2"></i>{SITE_CONFIG.description}</p>
                        <div className="flex justify-center items-center gap-4 opacity-50 hover:opacity-100 transition text-[10px] uppercase mb-6"><p>{SITE_CONFIG.footerText}</p></div>
                    </footer>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    
    <script>
	    if ('serviceWorker' in navigator) {
        	window.addEventListener('load', () => {
				navigator.serviceWorker.register('./sw.js?v=260819_1')
                	.then(registration => {
                    		console.log('✅ PWA 引擎啟動成功');
                    		registration.update();
                    		let refreshing;
                    		navigator.serviceWorker.addEventListener('controllerchange', () => {
                        		if (refreshing) return;
                        		refreshing = true;
                        		window.location.reload();
                    		});
                	})
                	.catch(err => { console.warn('❌ PWA 引擎啟動失敗: ', err); });
        	});
    	}
    </script>
</body>
</html>
